plugins {
    id 'com.android.application'
}

// SF Pro is Apple's font: it is git-ignored and never committed, so a fresh clone has no copy. Take it
// from the Mac's installed fonts when it is missing, or stop here with what to do instead of a
// resource error deep in the build.
def sfPro = file('src/main/res/font/sf_pro.ttf')
if (!sfPro.exists()) {
    def installed = ['/Library/Fonts/SF-Pro.ttf', "${System.getProperty('user.home')}/Library/Fonts/SF-Pro.ttf"]
            .collect { new File(it) }.find { it.exists() }
    if (installed == null) {
        throw new GradleException("SF Pro is missing: ${sfPro}\n" +
                "Install SF Pro from https://developer.apple.com/fonts/ (it puts SF-Pro.ttf in /Library/Fonts), " +
                "or copy SF-Pro.ttf to the path above, then build again.")
    }
    sfPro.parentFile.mkdirs()
    java.nio.file.Files.copy(installed.toPath(), sfPro.toPath())
    logger.lifecycle("Copied SF Pro from ${installed}")
}
// SF Pro Rounded Semibold, for the home screen's widget numerals; same rule as SF Pro.
def sfRounded = file('src/main/res/font/sf_pro_rounded_semibold.otf')
if (!sfRounded.exists()) {
    def installed = ['/Library/Fonts/SF-Pro-Rounded-Semibold.otf', "${System.getProperty('user.home')}/Library/Fonts/SF-Pro-Rounded-Semibold.otf"]
            .collect { new File(it) }.find { it.exists() }
    if (installed == null) {
        throw new GradleException("SF Pro Rounded is missing: ${sfRounded}\n" +
                "Install SF Pro from https://developer.apple.com/fonts/ (it includes SF-Pro-Rounded-Semibold.otf), then build again.")
    }
    java.nio.file.Files.copy(installed.toPath(), sfRounded.toPath())
    logger.lifecycle("Copied SF Pro Rounded from ${installed}")
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.2'
        // The TV runs 32-bit apps only (ro.product.cpu.abilist = armeabi-v7a).
        ndk {
            abiFilters 'armeabi-v7a'
        }
        externalNativeBuild {
            ndkBuild {
                // hev-socks5-tunnel's JNI registers on this class (src/main/jni/README.md).
                arguments 'APP_CFLAGS+=-DPKGNAME=com/gathin/tvhome', 'APP_CFLAGS+=-DCLSNAME=LimiterVpn',
                        'APP_PLATFORM=android-26', 'APP_STL=none'
                targets 'hev-socks5-tunnel'
            }
        }
    }

    ndkVersion '27.3.13750724'
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    // Fonts stored uncompressed: Android then maps SF Pro (21 MB) straight from the APK instead of
    // unpacking it into native memory, and Fonts can open it by file descriptor.
    androidResources {
        noCompress 'ttf', 'otf'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
